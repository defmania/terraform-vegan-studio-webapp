name: 'Terraform Deploy'

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to run'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  TF_VERSION: '1.12.0'
  AWS_REGION: 'us-east-1'

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    
    # Use environment protection for production deployments
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    
    # Ensure only one Terraform run at a time to prevent state conflicts
    concurrency:
      group: terraform-${{ github.ref }}
      cancel-in-progress: false
    
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication
      pull-requests: write  # Required for PR comments
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: terraform-github-actions
        aws-region: ${{ env.AWS_REGION }}
        # Fallback to access keys if OIDC is not configured
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}
        terraform_wrapper: true

    - name: Terraform Format Check
      id: fmt
      run: terraform fmt -check -recursive
      continue-on-error: true

    - name: Terraform Initialize
      id: init
      run: terraform init

    - name: Terraform Validate
      id: validate
      run: terraform validate -no-color

    - name: Terraform Plan
      id: plan
      if: github.event_name == 'pull_request' || github.event.inputs.action == 'plan' || github.event.inputs.action == ''
      run: |
        terraform plan -no-color -input=false \
          -var="db_password=${{ secrets.DB_PASSWORD }}" \
          -var="app_fqdn=${{ secrets.APP_FQDN }}" \
          -var="my_hosted_zone_name=${{ secrets.HOSTED_ZONE_NAME }}" \
          -var="bucket_name=${{ secrets.S3_BUCKET_NAME || 'vs-bucket-defmania' }}" \
          -var="key_pair_name=${{ secrets.EC2_KEY_PAIR_NAME || 'def-yoga2' }}" \
          -out=tfplan
      continue-on-error: true

    - name: Update Pull Request
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      env:
        PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
      with:
        script: |
          // 1. Retrieve existing bot comments for the PR
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          })
          const botComment = comments.find(comment => {
            return comment.user.type === 'Bot' && comment.body.includes('Terraform Format and Style')
          })

          // 2. Prepare format of the comment
          const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
          #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
          #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
          #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

          <details><summary>Show Plan</summary>

          \`\`\`terraform
          ${process.env.PLAN}
          \`\`\`

          </details>

          *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

          // 3. If we have a comment, update it, otherwise create a new one
          if (botComment) {
            github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: output
            })
          } else {
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
          }

    - name: Terraform Apply
      id: apply
      if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.action == 'apply')
      run: |
        terraform apply -auto-approve -input=false \
          -var="db_password=${{ secrets.DB_PASSWORD }}" \
          -var="app_fqdn=${{ secrets.APP_FQDN }}" \
          -var="my_hosted_zone_name=${{ secrets.HOSTED_ZONE_NAME }}" \
          -var="bucket_name=${{ secrets.S3_BUCKET_NAME || 'vs-bucket-defmania' }}" \
          -var="key_pair_name=${{ secrets.EC2_KEY_PAIR_NAME || 'def-yoga2' }}"

    - name: Terraform Destroy
      id: destroy
      if: github.event.inputs.action == 'destroy'
      run: |
        terraform destroy -auto-approve -input=false \
          -var="db_password=${{ secrets.DB_PASSWORD }}" \
          -var="app_fqdn=${{ secrets.APP_FQDN }}" \
          -var="my_hosted_zone_name=${{ secrets.HOSTED_ZONE_NAME }}" \
          -var="bucket_name=${{ secrets.S3_BUCKET_NAME || 'vs-bucket-defmania' }}" \
          -var="key_pair_name=${{ secrets.EC2_KEY_PAIR_NAME || 'def-yoga2' }}"

    - name: Post Apply Summary
      if: steps.apply.outcome == 'success'
      run: |
        echo "### ✅ Terraform Apply Successful" >> $GITHUB_STEP_SUMMARY
        echo "Infrastructure has been deployed successfully to AWS." >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Development' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

    - name: Post Destroy Summary
      if: steps.destroy.outcome == 'success'
      run: |
        echo "### ⚠️ Terraform Destroy Successful" >> $GITHUB_STEP_SUMMARY
        echo "Infrastructure has been destroyed." >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Development' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY

    outputs:
      fmt: ${{ steps.fmt.outcome }}
      init: ${{ steps.init.outcome }}
      validate: ${{ steps.validate.outcome }}
      plan: ${{ steps.plan.outcome }}
      apply: ${{ steps.apply.outcome }}
      destroy: ${{ steps.destroy.outcome }}